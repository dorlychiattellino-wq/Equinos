<div id="updBanner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#e08a20;color:#fff;padding:.8rem 1rem;justify-content:space-between;align-items:center;gap:.6rem;font-weight:700;box-shadow:0 -2px 8px rgba(0,0,0,.3)"><span>🆕 Hay una versión nueva de EQUINOS.</span><button onclick="actualizarApp()" style="background:#fff;color:#00236e;border:none;border-radius:8px;padding:.6rem 1rem;font-weight:800;font-size:1rem;width:auto">Actualizar ahora</button></div>
<div id="root"><div class="loading"><div class="spinner"></div><span>Conectando con la base de datos...</span></div></div>

<script>
window.APP_VERSION="2026.10.27-b";
window.actualizarApp=async function(){
  try{ if("serviceWorker" in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); for(const r of regs)await r.unregister(); } }catch(e){}
  try{ if(window.caches){ const ks=await caches.keys(); for(const k of ks)await caches.delete(k); } }catch(e){}
  location.reload();
};
if("serviceWorker" in navigator){
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
      reg.update().catch(()=>{});
      reg.addEventListener("updatefound",()=>{ const nw=reg.installing; if(!nw)return; nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller){ const b=document.getElementById("updBanner"); if(b)b.style.display="flex"; } }); });
      if(reg.waiting&&navigator.serviceWorker.controller){ const b=document.getElementById("updBanner"); if(b)b.style.display="flex"; }
    }catch(e){}
  });
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set as _set, get, remove as _remove, onValue as _onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ═══════════════════════════════════════════════════════════════
   CONFIGURACIÓN DE FIREBASE
   Por defecto usa el MISMO proyecto de Firebase que Stock Ganadero,
   pero todos los datos de EQUINOS viven aparte, bajo la rama "equinos/"
   (usuarios, caballos y eventos propios; no se mezclan con el ganado).
   Si algún día querés un proyecto separado: creá uno en
   console.firebase.google.com (Realtime Database), pegá acá su config
   y subí las reglas del archivo database.rules.json.
   ═══════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyBRHHCKsQ1Sz8o_hJ3Q0oKFiqaSWCyr5Wg",
  authDomain: "stock-ganadero-48715.firebaseapp.com",
  databaseURL: "https://stock-ganadero-48715-default-rtdb.firebaseio.com",
  projectId: "stock-ganadero-48715",
  storageBucket: "stock-ganadero-48715.firebasestorage.app",
  messagingSenderId: "853019546392",
  appId: "1:853019546392:web:6ab58bde61caeb90ffc46d"
};
const RAIZ="equinos"; // rama de la base de datos donde vive esta app

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);
const R=(p)=>ref(db,RAIZ+"/"+p);

/* ══════════ CAPA OFFLINE ══════════
   1) Cache local (IndexedDB): cada dato que llega de Firebase se guarda en el dispositivo.
      Al abrir sin señal, la app arranca con los últimos datos vistos.
   2) Cola de escrituras: lo que se carga/edita sin señal queda guardado en el dispositivo
      y se sube solo cuando vuelve internet (aunque se haya cerrado la app).
   3) Cada registro tiene un id único generado en el dispositivo (fecha + azar), y se guarda
      en su propia ruta: dos operarios cargando a la vez nunca se pisan ni se duplican. */
function pathOf(r){ try{ return decodeURIComponent(new URL(r.toString()).pathname.slice(1)); }catch(e){ return ""; } }
const _idb=(()=>{ let p=null; return ()=>{ if(p)return p; p=new Promise((res,rej)=>{ try{ const q=indexedDB.open("eq_cache",1); q.onupgradeneeded=()=>{ q.result.createObjectStore("kv"); }; q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }catch(e){ rej(e); } }); return p; }; })();
function cacheGet(k){ return _idb().then(db=>new Promise((res)=>{ try{ const t=db.transaction("kv","readonly").objectStore("kv").get(k); t.onsuccess=()=>res(t.result===undefined?null:t.result); t.onerror=()=>res(null); }catch(e){ res(null); } })).catch(()=>{ try{ const c=localStorage.getItem("eqcache_"+k); return c===null?null:JSON.parse(c); }catch(e){ return null; } }); }
function cacheSet(k,v){ return _idb().then(db=>new Promise((res)=>{ try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } })).catch(()=>{ try{ localStorage.setItem("eqcache_"+k,JSON.stringify(v)); return true; }catch(e){ return false; } }); }
let _cacheHits=0;
function onValue(r,cb){
  const path=pathOf(r); let llegoRed=false;
  cacheGet(path).then(v=>{ if(v===null)return; _cacheHits++; if(!llegoRed)cb({val:()=>v}); });
  return _onValue(r,snap=>{ llegoRed=true; cacheSet(path,snap.val()); cb(snap); });
}
function leerCola(){ try{ return JSON.parse(localStorage.getItem("eq_cola")||"[]"); }catch(e){ return []; } }
function guardarCola(c){ try{ localStorage.setItem("eq_cola",JSON.stringify(c.slice(-5000))); }catch(e){} }
function encolar(op){ let c=leerCola(); if(op.t==="set")c=c.filter(o=>!(o.t==="set"&&o.path===op.path)); c.push(op); guardarCola(c); }
function sacarDeCola(id){ guardarCola(leerCola().filter(o=>o.id!==id)); }
function opId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function limpio(v){ if(Array.isArray(v))return v.map(limpio); if(v&&typeof v==="object"){ const o={}; for(const k in v){ if(v[k]===undefined)continue; o[k]=limpio(v[k]); } return o; } return v===undefined?null:v; }
function set(path,val){
  val=limpio(val); const r=R(path);
  const op={id:opId(),t:"set",path:pathOf(r),val:val};
  encolar(op);
  try{ _set(r,val).then(()=>sacarDeCola(op.id)).catch(e=>{ const m=String(e&&(e.code||e.message)||e); if(!/network|offline|timeout|disconnect/i.test(m)){ sacarDeCola(op.id); toast("⚠️ No se pudo guardar: "+m.slice(0,80)); } }); }
  catch(e){ sacarDeCola(op.id); }
  pendientesBarra(); return Promise.resolve();
}
function remove(path){
  const r=R(path); const op={id:opId(),t:"del",path:pathOf(r)};
  encolar(op);
  try{ _remove(r).then(()=>sacarDeCola(op.id)).catch(()=>{}); }catch(e){ sacarDeCola(op.id); }
  pendientesBarra(); return Promise.resolve();
}
let colaReintentando=false;
function reintentarCola(){
  if(colaReintentando)return; const c=leerCola(); if(!c.length)return; colaReintentando=true; let rest=c.length;
  const fin=()=>{ if(--rest===0){colaReintentando=false;pendientesBarra();} };
  for(const op of c){ let p; try{ const r=ref(db,op.path); p=op.t==="del"?_remove(r):_set(r,op.val); }catch(e){ sacarDeCola(op.id); fin(); continue; }
    p.then(()=>sacarDeCola(op.id)).catch(e=>{ const m=String(e&&(e.code||e.message)||e); if(!/network|offline|timeout|disconnect/i.test(m)){ const c2=leerCola(); const o=c2.find(x=>x.id===op.id); if(o){ o.fails=(o.fails||0)+1; if(o.fails>=5)sacarDeCola(op.id); else guardarCola(c2); } } }).finally(fin); }
}
setInterval(()=>{ try{ if(navigator.onLine&&leerCola().length)reintentarCola(); }catch(e){} },30000);
window.addEventListener("online",()=>{ reintentarCola(); pendientesBarra(); });
window.addEventListener("offline",()=>pendientesBarra());
function pendientesBarra(){ if(state.loaded)render(); }
setTimeout(()=>{
  const r=document.getElementById("root");
  if(r&&/Conectando/.test(r.textContent||"")){
    if(_cacheHits>0){ state.loaded=true; render(); return; }
    r.innerHTML='<div class="login-box" style="text-align:center"><div class="ico">📡</div><h1 style="letter-spacing:0">Sin señal</h1><p style="margin-top:.6rem;font-size:.95rem;color:#243a66">Este dispositivo todavía no tiene guardados los datos para abrir sin internet.<br><br><strong>Qué hacer:</strong> conectá el teléfono o la tablet a internet un momento, tocá Reintentar y esperá a que aparezca "Conectado". Desde ahí la app va a abrir sin señal.</p><button class="bp big" style="margin-top:1rem" onclick="location.reload()">🔄 Reintentar</button></div>';

function buscarPorNombre(nombre,rp){ // busca un caballo del plantel por nombre (o RP) para armar el árbol
  if(rp!==""&&rp!=null){ const r=lista().find(c=>String(c.rp)===String(rp)); if(r)return r; }
  const n=normTxt(nombre); if(!n)return null;
  return lista().find(c=>normTxt(c.nombre)===n)||lista().find(c=>normTxt(c.nombre)==="LA "+n||normTxt(c.nombre)==="EL "+n||"LA "+normTxt(c.nombre)===n||"EL "+normTxt(c.nombre)===n)||null;
}
function hijosDe(c){ const n=normTxt(c.nombre); return lista().filter(x=>x.id!==c.id&&((n&&(normTxt(x.madre)===n||normTxt(x.padre)===n))||(c.rp!=null&&c.rp!==""&&(String(x.madreRp)===String(c.rp)||String(x.padreRp)===String(c.rp))))).sort((a,b)=>(a.fechaNac||"").localeCompare(b.fechaNac||"")); }
function proximoRP(){ let m=0; lista().forEach(c=>{ const n=Number(c.rp); if(!isNaN(n)&&n>m)m=n; }); return m+1; }

window.modoLogin=(m)=>{ state.loginModo=m; state.loginErr=""; render(); setTimeout(()=>{const e=document.getElementById("lg_nombre");if(e)e.focus();},30); };
window.crearPrimerAdmin=async function(){
  const nombre=(document.getElementById("su_nombre").value||"").trim(); const c1=document.getElementById("su_clave").value||""; const c2=document.getElementById("su_clave2").value||"";
  if(!nombre){state.setupErr="Escribí el nombre del administrador.";render();return;}
  if(c1.length<4){state.setupErr="La clave tiene que tener al menos 4 caracteres.";render();return;}
  if(c1!==c2){state.setupErr="Las claves no coinciden.";render();return;}
  const id=uid(); state.usuarios[id]={id,nombre,rol:"admin",clave:c1,baja:false};
  await set("usuarios/"+id,state.usuarios[id]);
  state.sesion=id; localStorage.setItem("eq_sesion",id); state.setupErr="";
  if(!lista().length)await cargarPlanillaInicial(true);
  toast("✅ Administrador creado. ¡Bienvenido, "+nombre+"!"); render();
};
window.login=function(){
  const nombre=(document.getElementById("lg_nombre").value||"").trim(); const clave=(document.getElementById("lg_clave")||{}).value||"";
  const u=Object.values(state.usuarios).find(x=>x&&normTxt(x.nombre)===normTxt(nombre));
  if(!u){state.loginErr="No encontramos ese nombre. Pedile a un administrador que te dé de alta.";render();return;}
  if(u.baja){state.loginErr="Tu acceso fue dado de baja. Hablá con un administrador.";render();return;}
  if(state.loginModo==="admin"){ if(u.rol!=="admin"){state.loginErr="Ese nombre no es de administrador. Entrá por la pestaña Operario.";render();return;} if((u.clave||"")!==clave){state.loginErr="Clave incorrecta.";render();return;} }
  else if(u.rol==="admin"){state.loginErr="Sos administrador: entrá por la pestaña Administrador con tu clave.";render();return;}
  state.sesion=u.id; localStorage.setItem("eq_sesion",u.id); state.loginErr=""; const t=tabsVisibles(); state.tab=t.length?t[0][0]:"equinos"; render();
};
window.logout=function(){ state.sesion=null; localStorage.removeItem("eq_sesion"); state.tab="equinos"; render(); };

async function cargarPlanillaInicial(silencioso){
  const u=usuarioActual(); const existentes=new Set(lista().map(c=>String(c.rp))); let n=0;
  for(const s of SEED){ if(existentes.has(String(s.rp)))continue; const id=uid(); const c=Object.assign({id,sba:"",nombre:"",fechaNac:"",pelaje:"",genero:"",madre:"",madreRp:"",padre:"",padreRp:"",propMadre:"",propPadre:"",propietario:"",obs:"",muerto:false,manso:false,cedido:false,padrilloPropio:false,chipeado:false},s,{creado:new Date().toISOString(),creadoPor:u?u.nombre:"",origen:"planilla SRA"}); state.caballos[id]=c; await set("caballos/"+id,c); n++; await new Promise(r=>setTimeout(r,5)); }
  if(!silencioso)toast(n?"✅ Se cargaron "+n+" equinos de la planilla SRA":"Todos los equinos de la planilla ya estaban cargados");
  render();
}

function snapshotForm(){ const o={}; document.querySelectorAll("[id^='f_'],[id^='p_'],[id^='nu_'],[id^='lg_'],[id^='su_'],[id^='l_']").forEach(e=>{ o[e.id]=e.type==="checkbox"?e.checked:e.value; }); return o; }
function restoreForm(o){ for(const id in o){ const e=document.getElementById(id); if(!e)continue; if(e.type==="checkbox")e.checked=o[id]; else if(e.value!==o[id])e.value=o[id]; } }
function render(){
  const root=document.getElementById("root"); if(!root)return;
  const ae=document.activeElement; const aeId=ae&&ae.id; const sel=ae&&typeof ae.selectionStart==="number"?ae.selectionStart:null;
  const snap=snapshotForm(); const key=state.formKey;
  if(!state.loaded){ root.innerHTML='<div class="loading"><div class="spinner"></div><span>Conectando con la base de datos...</span></div>'; return; }
  let html="";
  const hayAdmin=Object.values(state.usuarios).some(u=>u&&u.rol==="admin");
  if(!hayAdmin)html=renderSetup();
  else if(!usuarioActual())html=renderLogin();
  else html=renderApp();
  root.innerHTML=html;
  if(key&&state.formKey===key)restoreForm(snap);
  if(aeId){ const e=document.getElementById(aeId); if(e&&e!==document.activeElement){ try{ e.focus({preventScroll:true}); if(sel!=null&&typeof e.setSelectionRange==="function"&&/text|search/.test(e.type))e.setSelectionRange(sel,sel); }catch(x){} } }
  if(state.modal)document.body.style.overflow="hidden"; else document.body.style.overflow="";
}

function filtrarCaballos(){
  const f=state.f; const q=normTxt(f.q);
  let L=lista().filter(c=>{
    if((f.grupo||"sra")==="comprado"?!esComprado(c):esComprado(c))return false;
    if(f.estado==="vivos"&&c.muerto)return false; if(f.estado==="muertos"&&!c.muerto)return false; if(f.estado==="mansos"&&!c.manso)return false; if(f.estado==="chipeados"&&!c.chipeado)return false; if(f.estado==="cedidos"&&!c.cedido)return false; if(f.estado==="padrillos"&&!(c.padrilloPropio||c.genero==="MP"))return false;
    if(f.genero&&c.genero!==f.genero)return false; if(f.pelaje&&normTxt(c.pelaje)!==f.pelaje)return false;
    if(f.sra==="si"&&!c.sba)return false; if(f.sra==="no"&&c.sba)return false; if(f.anio&&anioDe(c.fechaNac)!==f.anio)return false;
    if(f.prop&&![c.propietario,c.propMadre,c.propPadre].includes(f.prop))return false;
    if(q){ const txt=normTxt([c.nombre,c.rp,c.sba,c.pelaje,c.madre,c.padre,c.propietario,c.propMadre,c.propPadre,c.obs].join(" ")); if(!q.split(" ").every(w=>txt.includes(w)))return false; }
    return true; });
  const o=f.orden, d=f.dir==="desc"?-1:1; L.sort((a,b)=>{ let r=0; if(o==="rp")r=(a.rp===""||a.rp==null?1e9:Number(a.rp)||0)-(b.rp===""||b.rp==null?1e9:Number(b.rp)||0); else if(o==="nombre")r=(a.nombre||"\uffff").localeCompare(b.nombre||"\uffff"); else if(o==="fecha")r=(a.fechaNac||"\uffff").localeCompare(b.fechaNac||"\uffff"); return r*d; });
  return L;
}

window.guardarPart=async function(){
  const g=(id)=>{ const e=document.getElementById(id); return e?e.value.trim():null; };
  if(!state.partCabId)return alert("Elegí el equino, o tocá \"Sin nombre\" si no se sabe cuál fue.");
  const fecha=g("p_fecha"); if(!fecha)return alert("Falta la fecha."); const evento=g("p_evento"); if(!evento)return alert("Falta el nombre del evento."); const rueda=g("p_rueda"); if(!rueda)return alert("Elegí la rueda.");
  const u=usuarioActual(); const prev=state.editPart.id?state.parts[state.editPart.id]||{}:{};
  const dup=state.partCabId===SIN_EQ?null:Object.values(state.parts).find(x=>x&&x.id!==state.editPart.id&&x.caballoId===state.partCabId&&x.fecha===fecha&&x.rueda===rueda&&normTxt(x.evento)===normTxt(evento));
  if(dup&&!confirm("Ya hay una participación de este equino en "+evento+" ("+fmtF(fecha)+", "+rueda+"). ¿Cargar igual?"))return;
  const imp=g("p_importe"); const cantRaw=g("p_cantidad"); const p=Object.assign({},prev,{id:state.editPart.id||uid(),caballoId:state.partCabId,cantidad:state.partCabId===SIN_EQ?(Number(cantRaw)||1):"",fecha,evento,lugar:g("p_lugar")||"",rueda,importe:imp===null?(prev.importe??""):num(imp),resultado:g("p_resultado")||"",montador:g("p_montador")||"",obs:g("p_obs")||"",modificado:new Date().toISOString(),modificadoPor:u?u.nombre:""});
  if(!prev.id){ p.creado=p.modificado; p.creadoPor=p.modificadoPor; }
  state.parts[p.id]=p; await set("participaciones/"+p.id,p);
  toast("✅ Guardado: "+eqTxt(p)+" · "+evento+" · "+rueda);
  state.editPart=null; state.formKey=null; render();
};
window.eliminarPart=async function(id){ const p=state.parts[id]; if(!p)return; if(!confirm("¿Borrar esta participación ("+p.evento+" · "+fmtF(p.fecha)+")?"))return; delete state.parts[id]; await remove("participaciones/"+id); toast("🗑️ Participación borrada"); render(); };
function filtrarParts(){ const f=state.fe; const q=normTxt(f.q); return Object.values(state.parts).filter(p=>{ if(!p)return false; if(f.anio&&anioDe(p.fecha)!==f.anio)return false; if(f.rueda&&p.rueda!==f.rueda)return false; if(f.evento&&p.evento!==f.evento)return false; if(q){ const c=state.caballos[p.caballoId]||{}; const t=normTxt([p.evento,p.lugar,p.rueda,p.montador,p.resultado,p.obs,c.nombre,c.rp].join(" ")); if(!q.split(" ").every(w=>t.includes(w)))return false; } return true; }).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||"").localeCompare(a.creado||"")); }
function renderEventos(){

window.abrirNuevoUser=(rol)=>{ state.nuevoUserRol=rol; render(); setTimeout(()=>{const e=document.getElementById("nu_nombre");if(e)e.focus();},30); };
window.crearUser=async function(){ const rol=state.nuevoUserRol; const nombre=(document.getElementById("nu_nombre").value||"").trim(); if(!nombre)return alert("Escribí el nombre."); if(Object.values(state.usuarios).some(u=>u&&normTxt(u.nombre)===normTxt(nombre)))return alert("Ya hay un usuario con ese nombre."); const u={id:uid(),nombre,rol,baja:false}; if(rol==="admin"){ const c=(document.getElementById("nu_clave").value||"").trim(); if(c.length<4)return alert("La clave debe tener al menos 4 caracteres."); u.clave=c; } else u.permisos=Object.assign({},PERM_DEFAULT); state.usuarios[u.id]=u; await set("usuarios/"+u.id,u); state.nuevoUserRol=null; if(rol!=="admin")state.editPermUser=u.id; toast("✅ "+(rol==="admin"?"Administrador":"Operario")+" agregado: "+nombre); render(); };

window.claveUser=async function(id){ const u=state.usuarios[id]; if(!u)return; const c=prompt("Nueva clave para "+u.nombre+":"); if(c==null)return; if(c.trim().length<4)return alert("Mínimo 4 caracteres."); u.clave=c.trim(); await set("usuarios/"+id,u); toast("🔑 Clave actualizada"); };

window.agregarRueda=async function(){ const e=document.getElementById("f_nrueda"); const r=(e.value||"").trim(); if(!r)return; const rs=[...(state.config.ruedas||[])]; if(!rs.includes(r))rs.push(r); state.config.ruedas=rs; await set("config/ruedas",rs); e.value=""; render(); };

window.backup=function(){ const data={app:"EQUINOS",version:window.APP_VERSION,fecha:new Date().toISOString(),usuarios:state.usuarios,caballos:state.caballos,participaciones:state.parts,listas:state.listas,config:state.config}; const b=new Blob([JSON.stringify(data,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="Equinos_backup_"+hoy()+".json"; a.click(); };
window.restaurar=async function(file){ if(!file)return; if(!confirm("⚠️ Restaurar un backup REEMPLAZA todos los equinos y participaciones actuales por los del archivo. ¿Continuar?"))return; try{ const d=JSON.parse(await file.text()); if(d.app!=="EQUINOS")throw new Error("El archivo no es un backup de EQUINOS"); if(d.caballos){ state.caballos=d.caballos; await set("caballos",d.caballos); } if(d.participaciones){ state.parts=d.participaciones; await set("participaciones",d.participaciones); } if(d.listas){ state.listas=d.listas; await set("listas",d.listas); } if(d.config){ state.config=d.config; await set("config",d.config); } if(d.usuarios&&confirm("¿Restaurar también los usuarios y sus claves?")){ state.usuarios=d.usuarios; await set("usuarios",d.usuarios); } toast("✅ Backup restaurado"); render(); }catch(e){ alert("No se pudo restaurar: "+e.message); } };
window.importarExcel=async function(file){ if(!file)return; try{ const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true}); const ws=wb.Sheets["NACIMIENTOS"]||wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true}); let hi=rows.findIndex(r=>r&&String(r[0]||"").toUpperCase().replace(/\./g,"")==="RP"); if(hi<0)throw new Error("No encontré la fila de encabezados (R.P / S.B.A. / FEC. NAC. …)"); const H=rows[hi].map(x=>String(x||"").toUpperCase().replace(/\./g,"").trim()); const col=(n)=>H.findIndex(x=>x.startsWith(n)); const C={rp:col("RP"),sba:col("SBA"),fn:col("FEC NAC"),nom:col("NOMBRE"),pel:col("PELAJE"),gen:col("GENERO"),mu:col("MUERTES"),ma:col("MADRE"),marp:H.indexOf("RP",col("MADRE")),pa:col("PADRE"),parp:H.indexOf("RP2"),pm:col("PROPIET MADRE"),pp:col("PROPIET PADRE"),obs:col("OBSERVACIONES")}; const s=(r,i)=>{ if(i<0)return ""; const v=r[i]; if(v==null)return ""; if(v instanceof Date)return isNaN(v)?"":v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0"); return String(v).trim(); }; const ex=new Set(lista().map(c=>String(c.rp))); const u=usuarioActual(); let n=0,sk=0; for(const r of rows.slice(hi+1)){ if(!r)continue; const rp=Number(r[C.rp]); if(isNaN(rp)||r[C.rp]==null)continue; const nom=s(r,C.nom),fn=s(r,C.fn),sba=s(r,C.sba); if(!nom&&!fn&&!sba){continue;} if(ex.has(String(rp))){sk++;continue;} const obs=s(r,C.obs).toUpperCase(); const c={id:uid(),rp,sba,nombre:nom.toUpperCase(),fechaNac:fn,pelaje:s(r,C.pel).toUpperCase(),genero:s(r,C.gen).toUpperCase(),madre:s(r,C.ma).toUpperCase(),madreRp:s(r,C.marp),padre:s(r,C.pa).toUpperCase(),padreRp:s(r,C.parp),propMadre:s(r,C.pm).toUpperCase(),propPadre:s(r,C.pp).toUpperCase(),propietario:"",obs:s(r,C.obs),muerto:s(r,C.mu).toUpperCase()==="SI"||obs.includes("MUERTO"),manso:obs.includes("MANSO"),chipeado:obs.includes("CHIPEADO"),cedido:obs.includes("CEDID")||obs.includes("ENTREGAD"),padrilloPropio:obs.includes("PADRILLO PROPIO"),creado:new Date().toISOString(),creadoPor:u?u.nombre:"",origen:"importado de "+file.name}; state.caballos[c.id]=c; await set("caballos/"+c.id,c); ex.add(String(rp)); n++; } toast("✅ Importados "+n+" equinos"+(sk?" · "+sk+" ya existían (no se tocaron)":"")); render(); }catch(e){ alert("No se pudo importar: "+e.message); } };

function listaActual(){ return state.listaId?state.listas[state.listaId]||null:null; }
function guardarLista(L){ const u=usuarioActual(); L.modificado=new Date().toISOString(); L.modificadoPor=u?u.nombre:""; state.listas[L.id]=L; set("listas/"+L.id,L); }
window.nuevaLista=function(){ const u=usuarioActual(); const L={id:uid(),evento:"",lugar:"",desafio:[],dias:[],creado:new Date().toISOString(),creadoPor:u?u.nombre:""}; guardarLista(L); state.listaId=L.id; state.listaPrint=false; render(); setTimeout(()=>{const e=document.getElementById("l_evento");if(e)e.focus();},40); };
window.abrirLista=function(id){ state.listaId=id; state.listaPrint=false; state.pickQ={}; render(); window.scrollTo({top:0}); };
window.cerrarLista=function(){ state.listaId=null; state.listaPrint=false; state.pickQ={}; render(); };
window.eliminarLista=function(id){ const L=state.listas[id]; if(!L)return; if(!confirm("¿Borrar la lista \""+(L.evento||"sin nombre")+"\"?"))return; delete state.listas[id]; remove("listas/"+id); if(state.listaId===id)state.listaId=null; render(); };
window.duplicarLista=function(id){ const L=state.listas[id]; if(!L)return; const N=JSON.parse(JSON.stringify(L)); N.id=uid(); N.evento=(L.evento||"")+" (copia)"; N.creado=new Date().toISOString(); guardarLista(N); state.listaId=N.id; render(); };
window.setLista=function(k,v){ const L=listaActual(); if(!L)return; L[k]=v; guardarLista(L); };
window.setPick=function(key,v){ state.pickQ[key]=v; render(); };
function picker(key,onPickJs,excluir){ // buscador de equino en línea: devuelve HTML
  const q=normTxt(state.pickQ[key]||""); const ex=new Set(excluir||[]);
  const cands=q?lista().filter(c=>!c.muerto&&!ex.has(c.id)&&q.split(" ").every(w=>normTxt([c.nombre,c.rp,c.sba,c.pelaje].join(" ")).includes(w))).slice(0,10):[];
  return `<div style="position:relative"><input id="pk_${key}" type="search" placeholder="🔍 Agregar equino (nombre o RP)…" value="${h(state.pickQ[key]||"")}" oninput="setPick('${key}',this.value)" autocomplete="off" style="padding:.45rem .55rem;font-size:.92rem"/>
  ${q?`<div class="sel-list" style="position:absolute;left:0;right:0;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18)">${cands.map(c=>`<div class="sel-item" onclick="${onPickJs.replace("%ID%",c.id)}"><strong>${h(c.nombre||"(sin nombre)")}</strong> · RP ${h(c.rp)} <span class="km">${h(c.pelaje)} ${tagGen(c)}</span></div>`).join("")||'<div class="empty" style="padding:.6rem">No se encontró</div>'}</div>`:""}</div>`;
}
// Desafío de criadores (con padres y madres)
window.desafioAdd=function(cabId){ const L=listaActual(); if(!L)return; L.desafio=L.desafio||[]; L.desafio.push({cabId,categoria:"",montador:"",suplente:false}); state.pickQ.desafio=""; guardarLista(L); render(); };
window.desafioSet=function(i,k,v){ const L=listaActual(); if(!L||!L.desafio[i])return; L.desafio[i][k]=v; guardarLista(L); if(k==="suplente"||k==="categoria")render(); };
window.desafioDel=function(i){ const L=listaActual(); if(!L)return; L.desafio.splice(i,1); guardarLista(L); render(); };
window.desafioMove=function(i,d){ const L=listaActual(); const a=L.desafio; const j=i+d; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; guardarLista(L); render(); };
// Días con ruedas (solo nombre)
window.diaAdd=function(){ const L=listaActual(); if(!L)return; L.dias=L.dias||[]; const ult=L.dias[L.dias.length-1]; let f=hoy(); if(ult&&ult.fecha){ const d=new Date(ult.fecha+"T00:00:00"); d.setDate(d.getDate()+1); f=d.toISOString().slice(0,10); } L.dias.push({fecha:f,ruedas:[{rueda:"Basto",ids:[]},{rueda:"Grupa",ids:[]},{rueda:"Crina",ids:[]}]}); guardarLista(L); render(); };
window.diaSet=function(d,k,v){ const L=listaActual(); if(!L||!L.dias[d])return; L.dias[d][k]=v; guardarLista(L); render(); };
window.diaDel=function(d){ const L=listaActual(); if(!L)return; if(!confirm("¿Quitar este día de la lista?"))return; L.dias.splice(d,1); guardarLista(L); render(); };
window.ruedaAdd=function(d,v){ if(!v)return; const L=listaActual(); if(!L||!L.dias[d])return; let r=v; if(v==="__otra"){ r=prompt("Nombre de la columna (ej: Final crina):"); if(!r||!r.trim())return; r=r.trim(); } L.dias[d].ruedas=L.dias[d].ruedas||[]; L.dias[d].ruedas.push({rueda:r,ids:[]}); guardarLista(L); render(); };
window.ruedaDel=function(d,r){ const L=listaActual(); if(!L)return; const R_=L.dias[d].ruedas[r]; if((R_.ids||[]).length&&!confirm("La columna "+R_.rueda+" tiene "+R_.ids.length+" equino(s). ¿Quitarla igual?"))return; L.dias[d].ruedas.splice(r,1); guardarLista(L); render(); };
window.ruedaAddCab=function(d,r,cabId){ const L=listaActual(); if(!L)return; const R_=L.dias[d].ruedas[r]; R_.ids=R_.ids||[]; if(!R_.ids.includes(cabId))R_.ids.push(cabId); state.pickQ["d"+d+"r"+r]=""; guardarLista(L); render(); };
window.ruedaDelCab=function(d,r,i){ const L=listaActual(); if(!L)return; L.dias[d].ruedas[r].ids.splice(i,1); guardarLista(L); render(); };
window.ruedaMoveCab=function(d,r,i,dir){ const L=listaActual(); const a=L.dias[d].ruedas[r].ids; const j=i+dir; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; guardarLista(L); render(); };
window.imprimirLista=function(){ state.listaPrint=true; render(); setTimeout(()=>window.print(),400); };
window.volverLista=function(){ state.listaPrint=false; render(); };
window.listaAParticipaciones=async function(){
  const L=listaActual(); if(!L)return; if(!L.evento)return alert("Poné el nombre del evento primero.");
  const u=usuarioActual(); let n=0,rep=0;
  for(const d of (L.dias||[])){ if(!d.fecha)continue; for(const R_ of (d.ruedas||[])){ for(const id of (R_.ids||[])){ if(!state.caballos[id])continue;
    const dup=Object.values(state.parts).find(x=>x&&x.caballoId===id&&x.fecha===d.fecha&&x.rueda===R_.rueda&&normTxt(x.evento)===normTxt(L.evento)); if(dup){rep++;continue;}
    const p={id:uid(),caballoId:id,fecha:d.fecha,evento:L.evento,lugar:L.lugar||"",rueda:R_.rueda,importe:"",resultado:"",montador:"",obs:"",creado:new Date().toISOString(),creadoPor:u?u.nombre:"",origen:"lista"}; state.parts[p.id]=p; await set("participaciones/"+p.id,p); n++; } } }
  toast("✅ "+n+" participación(es) cargadas en Eventos"+(rep?" · "+rep+" ya existían":"")+". Después completás importe y resultado."); render();
};
const DIAS_ES=["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
function diaNombre(f){ if(!f)return "(sin fecha)"; const d=new Date(f+"T00:00:00"); if(isNaN(d))return f; return DIAS_ES[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1); }
function renderListas(){
  if(state.listaId&&state.listaPrint)return renderListaPrint();
  if(state.listaId)return renderListaEdit();
  const Ls=Object.values(state.listas).filter(Boolean).sort((a,b)=>(b.creado||"").localeCompare(a.creado||""));
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.7rem"><h2 style="margin:0">📄 Listas para eventos</h2><button class="bp v" onclick="nuevaLista()">➕ Nueva lista</button></div>
  <p class="hint">Armá la planilla de los equinos que van a un evento y después imprimila o guardala como PDF. Tiene dos partes: el <strong>Desafío de criadores</strong> (con padres, madres y propietarios) y las <strong>ruedas de cada día</strong> (solo el nombre). Cuando el evento ya pasó, con un botón se cargan todas las participaciones en Eventos.</p>
  ${Ls.length?`<div class="tw"><table><thead><tr><th>Evento</th><th>Lugar</th><th>Días</th><th>Desafío</th><th>En ruedas</th><th>Armada por</th><th></th></tr></thead><tbody>${Ls.map(L=>{ const ds=(L.dias||[]).map(d=>fmtF(d.fecha)).filter(Boolean).join(", "); const n=(L.dias||[]).reduce((s,d)=>s+(d.ruedas||[]).reduce((t,r)=>t+(r.ids||[]).length,0),0); return `<tr class="cl" onclick="abrirLista('${L.id}')"><td><strong>${L.evento?h(L.evento):'<span class="blank">sin nombre</span>'}</strong></td><td>${h(L.lugar)}</td><td style="white-space:nowrap">${ds||"—"}</td><td>${(L.desafio||[]).length}</td><td>${n}</td><td class="km">${h(L.creadoPor)}</td><td style="white-space:nowrap" onclick="event.stopPropagation()"><button class="bi" title="Duplicar" onclick="duplicarLista('${L.id}')">📑</button><button class="bi" title="Borrar" onclick="eliminarLista('${L.id}')">🗑️</button></td></tr>`; }).join("")}</tbody></table></div>`:'<div class="empty">Todavía no hay listas. Tocá "Nueva lista" para armar la primera.</div>'}</div>`;
}
function renderListaEdit(){
  const L=listaActual(); if(!L)return ""; const rs=ruedas(); const enDesafio=(L.desafio||[]).map(x=>x.cabId);
  return `<div class="card" style="border:2px solid #1a5fd0"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem"><h2 style="margin:0">📄 Lista para evento</h2><div class="br" style="margin:0"><button class="bp" onclick="imprimirLista()">🖨️ Imprimir / PDF</button><button class="bs" style="background:#dcf8e3;border-color:#25D366;color:#075e54" onclick="compartirLista()">📲 PDF por WhatsApp</button><button class="bs" onclick="cerrarLista()">← Volver a las listas</button></div></div>
  <p class="hint">Todo se guarda solo a medida que cargás.</p>
  <div class="fg"><label>Evento *<input id="l_evento" list="dl_eventos" value="${h(L.evento)}" placeholder="Ej: Jineteada de Ayacucho" onchange="setLista('evento',this.value)" autocomplete="off"/><datalist id="dl_eventos">${eventosNombres().map(e=>`<option value="${h(e)}">`).join("")}</datalist></label><label>Lugar<input id="l_lugar" value="${h(L.lugar)}" onchange="setLista('lugar',this.value)" autocomplete="off"/></label></div></div>

  <div class="card"><h2>🏆 Desafío de criadores <span class="km">(va con padres, madres y propietarios)</span></h2>
  ${(L.desafio||[]).length?`<div class="tw"><table><thead><tr><th></th><th>Categoría</th><th>Montador</th><th>Equino</th><th>Nac.</th><th>Pelaje</th><th>Madre</th><th>Padre</th><th>Suplente</th><th></th></tr></thead><tbody>${L.desafio.map((x,i)=>{ const c=state.caballos[x.cabId]||{}; return `<tr style="${x.suplente?"background:#fff6bf":""}"><td style="white-space:nowrap"><button class="bi" onclick="desafioMove(${i},-1)">▲</button><button class="bi" onclick="desafioMove(${i},1)">▼</button></td><td><input list="dl_ruedas" value="${h(x.categoria)}" onchange="desafioSet(${i},'categoria',this.value)" style="min-width:130px;padding:.35rem .5rem;font-size:.9rem" placeholder="Rueda"/></td><td><input value="${h(x.montador)}" onchange="desafioSet(${i},'montador',this.value)" style="min-width:150px;padding:.35rem .5rem;font-size:.9rem" placeholder="Apellido, Nombre"/></td><td><strong>${h(c.nombre||"(sin nombre)")}</strong> <span class="km">RP ${h(c.rp)}</span></td><td style="white-space:nowrap">${fmtF(c.fechaNac)}</td><td>${h(c.pelaje)}</td><td>${h(c.madre)}</td><td>${h(c.padre)}</td><td><input type="checkbox" ${x.suplente?"checked":""} onchange="desafioSet(${i},'suplente',this.checked)" style="width:20px;height:20px"/></td><td><button class="bi" onclick="desafioDel(${i})">🗑️</button></td></tr>`; }).join("")}</tbody></table></div>`:'<p class="hint">Todavía no hay equinos en el desafío.</p>'}
  <datalist id="dl_ruedas">${rs.map(r=>`<option value="${h(r)}">`).join("")}</datalist>
  <div style="max-width:420px;margin-top:.5rem">${picker("desafio","desafioAdd('%ID%')",enDesafio)}</div></div>

  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem"><h2 style="margin:0">📅 Ruedas por día <span class="km">(solo el nombre)</span></h2><button class="bp v" onclick="diaAdd()">➕ Agregar día</button></div>
  ${(L.dias||[]).map((d,di)=>`<div style="border:1.5px solid #9cb4e2;border-radius:10px;padding:.8rem;margin-top:.9rem;background:#f8fafd">
    <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem"><strong style="font-size:1.05rem;color:#0033a0">${diaNombre(d.fecha)}</strong><input type="date" value="${h(d.fecha)}" onchange="diaSet(${di},'fecha',this.value)" style="width:auto;padding:.35rem .5rem"/><select onchange="ruedaAdd(${di},this.value);this.value=''" style="width:auto;padding:.35rem .5rem"><option value="">➕ Agregar columna…</option>${rs.map(r=>`<option>${h(r)}</option>`).join("")}<option value="__otra">Otra…</option></select><button class="bs" style="margin-left:auto;padding:.3rem .6rem" onclick="diaDel(${di})">🗑️ Quitar día</button></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem">${(d.ruedas||[]).map((R_,ri)=>`<div style="background:#fff;border:1px solid #d5deee;border-radius:8px;padding:.5rem"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem"><strong>${h(R_.rueda)}</strong><button class="bi" onclick="ruedaDel(${di},${ri})" title="Quitar columna">✕</button></div>
      ${(R_.ids||[]).map((id,i)=>{ const c=state.caballos[id]; return `<div style="display:flex;align-items:center;gap:.3rem;padding:.25rem 0;border-bottom:1px dashed #e3e9f3"><span style="flex:1;font-weight:700">${c?h(c.nombre||"RP "+c.rp):'<span class="blank">equino borrado</span>'}</span><button class="bi" style="font-size:.8rem" onclick="ruedaMoveCab(${di},${ri},${i},-1)">▲</button><button class="bi" style="font-size:.8rem" onclick="ruedaMoveCab(${di},${ri},${i},1)">▼</button><button class="bi" onclick="ruedaDelCab(${di},${ri},${i})">🗑️</button></div>`; }).join("")}
      <div style="margin-top:.4rem">${picker("d"+di+"r"+ri,`ruedaAddCab(${di},${ri},'%ID%')`,R_.ids||[])}</div></div>`).join("")||'<p class="hint">Agregá columnas (Basto, Grupa, Crina…) con el selector de arriba.</p>'}</div></div>`).join("")||'<p class="hint" style="margin-top:.6rem">Agregá un día: elegís la fecha y las columnas de ruedas, y vas sumando los equinos por nombre.</p>'}
  </div>
  <div class="card"><h3>Cuando el evento ya pasó</h3><p class="hint">Este botón crea en 🏇 Eventos una participación por cada equino de cada rueda y día (sin importe ni resultado, para completar después). No repite las que ya existan.</p><div class="br"><button class="bp" onclick="listaAParticipaciones()">📥 Cargar participaciones en Eventos</button></div></div>`;
}
function renderListaPrint(){
  const L=listaActual(); if(!L)return "";
  const tit=[...(L.desafio||[]).filter(x=>!x.suplente)],sup=(L.desafio||[]).filter(x=>x.suplente);
  const fila=(x)=>{ const c=state.caballos[x.cabId]||{}; return `<tr><td>${h(x.categoria)}</td><td>${h(x.montador)}</td><td>${h(c.rp)}</td><td>${h(c.sba)}</td><td>${fmtF(c.fechaNac)}</td><td><strong>${h(c.nombre)}</strong></td><td>${h(c.pelaje)}</td><td>${h(c.genero)}</td><td>${h(c.madre)}</td><td>${h(c.propMadre)}</td><td>${h(c.padre)}</td><td>${h(c.propPadre)}</td></tr>`; };
  const maxF=(d)=>Math.max(1,...(d.ruedas||[]).map(r=>(r.ids||[]).length));
  return `<div class="noprint br" style="margin-bottom:.8rem"><button class="bp" onclick="window.print()">🖨️ Imprimir / Guardar como PDF</button><button class="bs" style="background:#dcf8e3;border-color:#25D366;color:#075e54" onclick="compartirLista()">📲 PDF por WhatsApp</button><button class="bs" onclick="volverLista()">← Volver a editar</button><span class="km">En la ventana de impresión elegí "Guardar como PDF" y orientación horizontal.</span></div>
  <div class="hoja">
    <div style="font-size:.85rem">RAZA: 276 - CABALLO DE DESTREZA GAUCHA</div><div style="font-size:.85rem;margin-bottom:.4rem">CRIADOR: 46 - SOLSONA, OSVALDO GUSTAVO</div>
    <h1 style="font-size:1.3rem;margin:.2rem 0">${h(L.evento||"EVENTO")}${L.lugar?` · ${h(L.lugar)}`:""}</h1>
    ${(L.desafio||[]).length?`<h2 style="margin:.8rem 0 .3rem;font-size:1.05rem">DESAFÍO DE CRIADORES</h2>
    <table class="tp"><thead><tr><th>CATEGORÍA</th><th>MONTADOR</th><th>R.P</th><th>S.B.A.</th><th>FEC. NAC.</th><th>NOMBRE/CRÍA</th><th>PELAJE</th><th>GÉN.</th><th>MADRE</th><th>PROPIET. MADRE</th><th>PADRE</th><th>PROPIET. PADRE</th></tr></thead><tbody>${tit.map(fila).join("")}${sup.length?`<tr><td colspan="12" style="font-weight:800;background:#fff6bf">SUPLENTE${sup.length>1?"S":""}</td></tr>${sup.map(fila).join("")}`:""}</tbody></table>`:""}
    ${(L.dias||[]).length?`<div class="dias">${L.dias.map(d=>`<div class="dia"><h2 style="margin:.9rem 0 .3rem;font-size:1.05rem">${diaNombre(d.fecha)}</h2><table class="tp"><thead><tr>${(d.ruedas||[]).map(r=>`<th>${h(r.rueda).toUpperCase()}</th>`).join("")}</tr></thead><tbody>${Array.from({length:maxF(d)}).map((_,i)=>`<tr>${(d.ruedas||[]).map(r=>{ const c=state.caballos[(r.ids||[])[i]]; return `<td>${c?h(c.nombre||"RP "+c.rp):""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`).join("")}</div>`:""}
  </div>
  <style>.hoja{background:#fff;padding:1rem;border:1px solid #d5deee;border-radius:10px;color:#000}.tp{width:100%;border-collapse:collapse;font-size:.8rem}.tp th{background:#dfe8f8;color:#000;border:1px solid #777;padding:.3rem .4rem;font-size:.72rem;position:static}.tp td{border:1px solid #777;padding:.3rem .4rem;min-height:1.4em;text-transform:uppercase}.dias{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:flex-start}.dia{flex:1;min-width:260px}@media print{@page{size:landscape;margin:10mm}header,nav,.sync-bar,.noprint,#updBanner{display:none!important}main{padding:0;max-width:none}.hoja{border:none;padding:0;border-radius:0}.tp td,.tp th{padding:.2rem .3rem}.tp th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>`;
}

function renderModal(){ return ""; }

// ══════════ ARRANQUE ══════════
render();
</script>
</body>
</html>
